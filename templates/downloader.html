<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Downloader</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0d0d0d; --surface: #161616; --surface2: #1f1f1f;
    --border: #2a2a2a; --accent: #ff3c3c; --text: #f0f0f0;
    --muted: #666; --green: #00e676; --mono: 'Space Mono', monospace; --sans: 'DM Sans', sans-serif;
  }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); min-height: 100vh; }
  body::before {
    content: ''; position: fixed; inset: 0;
    background-image: linear-gradient(rgba(255,60,60,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,60,60,0.03) 1px, transparent 1px);
    background-size: 40px 40px; pointer-events: none; z-index: 0;
  }
  .wrap { position: relative; z-index: 1; max-width: 720px; margin: 0 auto; padding: 60px 24px 80px; }
  nav { display: flex; gap: 8px; margin-bottom: 48px; }
  .nav-btn { font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; padding: 8px 16px; border: 1px solid var(--border); border-radius: 2px; color: var(--muted); text-decoration: none; transition: all 0.15s; }
  .nav-btn:hover { border-color: #444; color: var(--text); }
  .nav-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(255,60,60,0.08); }
  .logo { font-family: var(--mono); font-size: 11px; letter-spacing: 0.2em; color: var(--accent); text-transform: uppercase; margin-bottom: 16px; }
  h1 { font-family: var(--mono); font-size: clamp(32px, 6vw, 52px); font-weight: 700; line-height: 1.1; }
  h1 span { color: var(--accent); }
  .subtitle { margin-top: 12px; color: var(--muted); font-size: 15px; font-weight: 300; margin-bottom: 48px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 2px; padding: 32px; margin-bottom: 24px; }
  .field { margin-bottom: 24px; }
  label { display: block; font-family: var(--mono); font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  input[type="text"] { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 2px; color: var(--text); font-family: var(--mono); font-size: 14px; padding: 12px 16px; outline: none; transition: border-color 0.15s; }
  input:focus { border-color: var(--accent); }
  .platform-row { display: flex; gap: 8px; margin-bottom: 24px; flex-wrap: wrap; }
  .platform-badge { font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; padding: 4px 10px; border: 1px solid var(--border); border-radius: 2px; color: var(--muted); }
  .platform-badge.yt { border-color: #ff0000; color: #ff4444; background: rgba(255,0,0,0.08); }
  .platform-badge.tt { border-color: #69c9d0; color: #69c9d0; background: rgba(105,201,208,0.08); }
  .platform-badge.tw { border-color: #1d9bf0; color: #1d9bf0; background: rgba(29,155,240,0.08); }
  button[type="submit"] { width: 100%; background: var(--accent); color: #fff; border: none; border-radius: 2px; font-family: var(--mono); font-size: 13px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; padding: 16px; cursor: pointer; transition: all 0.15s; }
  button[type="submit"]:hover { background: #e62e2e; }
  button[type="submit"]:disabled { background: var(--border); color: var(--muted); cursor: not-allowed; }
  .status-card { display: none; }
  .status-row { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: pulse 1s infinite; flex-shrink: 0; }
  .status-dot.done { background: var(--green); animation: none; }
  .status-dot.error { background: var(--accent); animation: none; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
  .status-text { font-family: var(--mono); font-size: 12px; }
  .progress-wrap { height: 3px; background: var(--surface2); border-radius: 2px; margin-bottom: 16px; overflow: hidden; }
  .progress-bar { height: 100%; background: linear-gradient(90deg, var(--accent), #ff7043); width: 0%; transition: width 0.4s; }
  .dl-result { display: none; }
  .dl-btn { display: block; width: 100%; background: var(--green); color: #000; border: none; border-radius: 2px; font-family: var(--mono); font-size: 13px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; padding: 16px; cursor: pointer; text-align: center; text-decoration: none; transition: all 0.15s; }
  .dl-btn:hover { background: #00c853; }
  .video-info { margin-bottom: 16px; }
  .video-title { font-size: 15px; font-weight: 500; margin-bottom: 4px; }
  .video-meta { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .error-text { font-family: var(--mono); font-size: 12px; color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <nav>
    <a href="/" class="nav-btn">Clipper</a>
    <a href="/downloader" class="nav-btn active">Downloader</a>
  </nav>

  <div class="logo">// auto-clipper v2.0</div>
  <h1>Down<span>load</span></h1>
  <p class="subtitle">Paste any video URL and download it to your laptop.</p>

  <div class="card">
    <div class="platform-row">
      <span class="platform-badge yt">YouTube</span>
      <span class="platform-badge tt">TikTok</span>
      <span class="platform-badge tw">X / Twitter</span>
      <span class="platform-badge">Instagram</span>
      <span class="platform-badge">Facebook</span>
    </div>
    <div class="field">
      <label>Video URL</label>
      <input type="text" id="url" placeholder="Paste any video URL here…" />
    </div>
    <button type="submit" id="dl-btn" onclick="startDownload()">Download Video</button>
  </div>

  <div class="card status-card" id="status-card">
    <div class="status-row">
      <div class="status-dot" id="status-dot"></div>
      <div class="status-text" id="status-text">Starting…</div>
    </div>
    <div class="progress-wrap"><div class="progress-bar" id="progress-bar"></div></div>
  </div>

  <div class="card dl-result" id="dl-result">
    <div class="video-info">
      <div class="video-title" id="video-title"></div>
      <div class="video-meta" id="video-meta"></div>
    </div>
    <a class="dl-btn" id="dl-link" href="#">Save to Computer</a>
  </div>
</div>

<script>
  let pollInterval = null;

  async function startDownload() {
    const url = document.getElementById('url').value.trim();
    if (!url) { alert('Please paste a video URL.'); return; }

    const btn = document.getElementById('dl-btn');
    btn.disabled = true;
    btn.textContent = 'Downloading…';

    document.getElementById('status-card').style.display = 'block';
    document.getElementById('dl-result').style.display = 'none';
    document.getElementById('status-dot').className = 'status-dot';
    document.getElementById('progress-bar').style.width = '0%';
    document.getElementById('status-text').textContent = 'Fetching video info…';

    const res = await fetch('/download-video', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url })
    });

    const { job_id } = await res.json();
    pollInterval = setInterval(() => pollStatus(job_id), 1500);
  }

  async function pollStatus(jobId) {
    const res = await fetch(`/download-status/${jobId}`);
    const job = await res.json();

    document.getElementById('status-text').textContent = job.message || 'Downloading…';
    document.getElementById('progress-bar').style.width = (job.progress || 0) + '%';

    if (job.status === 'done') {
      clearInterval(pollInterval);
      document.getElementById('status-dot').className = 'status-dot done';
      document.getElementById('status-text').textContent = 'Done!';
      document.getElementById('dl-btn').disabled = false;
      document.getElementById('dl-btn').textContent = 'Download Video';

      document.getElementById('dl-result').style.display = 'block';
      document.getElementById('video-title').textContent = job.title || 'Video';
      document.getElementById('video-meta').textContent = job.filename || '';
      document.getElementById('dl-link').href = `/get-video/${encodeURIComponent(job.filename)}`;

    } else if (job.status === 'error') {
      clearInterval(pollInterval);
      document.getElementById('status-dot').className = 'status-dot error';
      document.getElementById('status-text').textContent = 'Error: ' + job.message;
      document.getElementById('dl-btn').disabled = false;
      document.getElementById('dl-btn').textContent = 'Download Video';
    }
  }
</script>
</body>
</html>
